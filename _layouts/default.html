<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- SEO -->
  {% seo %}
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-primary: #B8951E;
      --color-primary-light: #D4AF37;
      --color-primary-dark: #8B6914;
      --color-text: #2C2A27;
      --color-text-muted: #5C5A57;
      --color-text-light: #7A7875;
      --color-bg: #FAF9F7;
      --color-bg-alt: #F5F3EF;
      --color-surface: #FFFFFF;
      --color-border: #E8E6E3;
      --color-border-light: #F0EEEB;
      --color-success: #4A7C59;
      --color-accent: #8B6914;
      --font-display: 'Gowun Batang', 'Noto Serif KR', serif;
      --font-body: 'Noto Sans KR', 'Pretendard', -apple-system, sans-serif;
      --max-width: 720px;
      --spacing-xs: 0.375rem;
      --spacing-sm: 0.75rem;
      --spacing-md: 1.25rem;
      --spacing-lg: 2rem;
      --spacing-xl: 3.5rem;
      --radius: 8px;
      --radius-sm: 6px;
      --shadow-soft: 0 2px 12px rgba(44, 42, 39, 0.06);
      --shadow-elevated: 0 8px 32px rgba(44, 42, 39, 0.08);
      --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(184, 149, 30, 0.08), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(184, 149, 30, 0.04), transparent);
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 249, 247, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border-light);
      padding: var(--spacing-md) var(--spacing-lg);
    }

    .site-header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-text);
      text-decoration: none;
      letter-spacing: -0.02em;
      transition: color 0.25s var(--ease-out);
    }

    .site-logo span {
      color: var(--color-primary-dark);
    }

    .site-logo:hover {
      color: var(--color-primary-dark);
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .site-nav a {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-muted);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.25s var(--ease-out);
    }

    .site-nav a:hover {
      color: var(--color-primary-dark);
      text-decoration: none;
    }

    .site-nav .nav-cta {
      padding: var(--spacing-xs) var(--spacing-sm);
      background: var(--color-text);
      color: var(--color-bg) !important;
      border-radius: var(--radius-sm);
      font-weight: 500;
    }

    .site-nav .nav-cta:hover {
      background: var(--color-primary-dark);
      color: var(--color-bg) !important;
      text-decoration: none;
    }

    /* Main Content */
    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--spacing-xl) var(--spacing-lg);
    }

    /* Typography - 가독성 최우선 */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.5;
      color: var(--color-text);
      margin-bottom: 0.75em;
    }

    h1 {
      font-size: 2.125rem;
      letter-spacing: -0.03em;
      line-height: 1.4;
    }

    h2 {
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      font-weight: 600;
      margin-top: 2em;
      margin-bottom: 0.85em;
      padding-bottom: 0.35em;
    }

    h2:first-of-type {
      margin-top: 0;
    }

    h3 {
      font-size: 1.25rem;
      font-family: var(--font-body);
      font-weight: 600;
      margin-top: 2.25em;
      margin-bottom: 0.6em;
    }

    h4 {
      font-size: 1.0625rem;
      font-family: var(--font-body);
      font-weight: 500;
      color: var(--color-text-muted);
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }

    p {
      margin-bottom: 1.25em;
      color: var(--color-text-muted);
      max-width: 65ch;
    }

    a {
      color: var(--color-accent);
      text-decoration: none;
      transition: color 0.25s var(--ease-out);
    }

    a:hover {
      color: var(--color-primary-dark);
      text-decoration: underline;
    }

    /* Blockquote */
    blockquote {
      margin: 1.5em 0;
      padding: 1.25em 1.5em;
      background: var(--color-surface);
      border-left: 3px solid var(--color-primary-light);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-style: normal;
      box-shadow: var(--shadow-soft);
    }

    blockquote p {
      margin-bottom: 0;
      max-width: none;
    }

    blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Lists */
    ul, ol {
      margin: 1em 0 1.25em;
      padding-left: 1.5rem;
      max-width: 65ch;
    }

    li {
      margin-bottom: 0.5em;
      color: var(--color-text-muted);
      line-height: 1.75;
    }

    /* Tables */
    table {
      width: 100%;
      margin: 1.5em 0;
      border-collapse: collapse;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--color-surface);
      box-shadow: var(--shadow-soft);
    }

    th, td {
      padding: 0.75em 1em;
      text-align: left;
      border-bottom: 1px solid var(--color-border-light);
      line-height: 1.5;
    }

    th {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.875rem;
      background: var(--color-bg-alt);
      color: var(--color-text);
    }

    td {
      color: var(--color-text-muted);
      font-size: 0.9375rem;
    }

    tr:nth-child(even) td {
      background: rgba(250, 249, 247, 0.5);
    }

    tr:hover td {
      background: rgba(184, 149, 30, 0.04);
    }

    /* Code */
    code {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 0.875em;
      background: var(--color-bg-alt);
      padding: 0.15em 0.4em;
      border-radius: var(--radius-sm);
      color: var(--color-primary-dark);
    }

    pre {
      background: var(--color-text);
      color: var(--color-bg);
      padding: var(--spacing-md);
      border-radius: var(--radius);
      overflow-x: auto;
      margin: var(--spacing-md) 0;
    }

    pre code {
      background: none;
      color: inherit;
    }

    /* Images */
    img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      margin: 1.5em 0;
      display: block;
    }

    em {
      display: block;
      text-align: center;
      color: var(--color-text-light);
      font-size: 0.8125rem;
      margin-top: calc(var(--spacing-xs) * -1);
      margin-bottom: var(--spacing-md);
    }

    hr {
      border: none;
      height: 1px;
      background: var(--color-border-light);
      margin: 2.5rem 0;
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      padding: var(--spacing-xl) 0 var(--spacing-xl);
      margin-bottom: var(--spacing-md);
    }

    .hero-section h1 {
      margin-top: 0;
      margin-bottom: 0.6em;
      border-bottom: none;
      font-size: 2.5rem;
      letter-spacing: -0.04em;
      line-height: 1.4;
      animation: fadeInUp 0.8s var(--ease-out) both;
    }

    .hero-subtitle {
      font-size: 1.0625rem;
      font-weight: 400;
      color: var(--color-text-muted);
      max-width: 42ch;
      margin: 0 auto var(--spacing-lg);
      line-height: 1.9;
      letter-spacing: 0.01em;
      animation: fadeInUp 0.8s var(--ease-out) 0.1s both;
    }

    .hero-subtitle .line-break {
      display: block;
      margin-top: 0.5em;
    }

    .hero-cta {
      display: flex;
      gap: var(--spacing-sm);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--spacing-lg);
      animation: fadeInUp 0.8s var(--ease-out) 0.2s both;
    }

    .hero-cta .app-button {
      padding: var(--spacing-sm) var(--spacing-lg);
      font-size: 0.9375rem;
    }

    .scroll-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-light);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.25s var(--ease-out);
      animation: fadeInUp 0.8s var(--ease-out) 0.3s both;
    }

    .scroll-hint:hover {
      color: var(--color-primary-dark);
      text-decoration: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Story Sections */
    h2.story-section {
      scroll-margin-top: 5.5rem;
      padding: 1.25rem var(--spacing-lg);
      margin-left: calc(var(--spacing-lg) * -1);
      margin-right: calc(var(--spacing-lg) * -1);
      border-radius: var(--radius);
      margin-top: 2.5rem;
      margin-bottom: 1.25rem;
      background: var(--color-surface);
      box-shadow: var(--shadow-soft);
      border-left: 3px solid var(--color-primary-light);
    }

    #background.story-section {
      background: linear-gradient(135deg, rgba(250, 249, 247, 0.98) 0%, rgba(245, 243, 239, 0.98) 100%);
      border-left-color: var(--color-primary-light);
    }

    #problem.story-section {
      background: linear-gradient(135deg, rgba(248, 246, 243, 0.98) 0%, rgba(245, 242, 238, 0.98) 100%);
      border-left-color: var(--color-text-light);
    }

    #solution.story-section {
      background: linear-gradient(135deg, rgba(245, 248, 245, 0.98) 0%, rgba(248, 250, 246, 0.98) 100%);
      border-left-color: var(--color-success);
    }

    .section-cta {
      display: flex;
      gap: var(--spacing-sm);
      justify-content: center;
      flex-wrap: wrap;
      margin-top: var(--spacing-lg);
      padding-top: var(--spacing-md);
    }

    #usage {
      scroll-margin-top: 5.5rem;
    }

    /* Story section 본문 - 타이틀 바로 아래 여백 */
    h2.story-section + p {
      margin-top: 0;
    }

    h2.story-section + p,
    h2.story-section + p + p {
      max-width: none;
    }

    /* blockquote 가독성 */
    blockquote p {
      line-height: 1.8;
    }

    strong {
      color: var(--color-text);
      font-weight: 500;
    }

    /* Footer */
    .site-footer {
      background: var(--color-bg-alt);
      border-top: 1px solid var(--color-border-light);
      padding: var(--spacing-xl) var(--spacing-lg);
      margin-top: var(--spacing-xl);
      text-align: center;
    }

    .site-footer-inner {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .footer-logo {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: var(--spacing-sm);
      color: var(--color-text);
    }

    .footer-logo span {
      color: var(--color-primary-dark);
    }

    .footer-tagline {
      font-size: 0.9375rem;
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-md);
    }

    .footer-links {
      display: flex;
      gap: var(--spacing-md);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--spacing-md);
    }

    .footer-links a {
      font-size: 0.8125rem;
      color: var(--color-text-light);
      transition: color 0.25s var(--ease-out);
    }

    .copyright {
      font-size: 0.75rem;
      color: var(--color-text-light);
    }

    /* App Download Buttons */
    .app-buttons {
      display: flex;
      gap: var(--spacing-sm);
      justify-content: center;
      flex-wrap: wrap;
      margin: var(--spacing-lg) 0;
    }

    .app-button {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--color-text);
      color: var(--color-bg) !important;
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none !important;
      transition: background 0.25s var(--ease-out), transform 0.2s var(--ease-out);
    }

    .app-button:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
      text-decoration: none !important;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .site-header-inner {
        flex-direction: column;
        gap: var(--spacing-sm);
      }

      .site-nav {
        width: 100%;
        justify-content: center;
      }

      .hero-section h1 {
        font-size: 1.75rem;
      }

      .hero-subtitle {
        font-size: 1rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      h2 {
        font-size: 1.375rem;
      }

      h2.story-section {
        margin-left: 0;
        margin-right: 0;
      }

      h3 {
        font-size: 1.125rem;
      }

      .content-wrapper {
        padding: var(--spacing-lg) var(--spacing-md);
      }

      table {
        font-size: 0.875rem;
      }

      th, td {
        padding: var(--spacing-xs) var(--spacing-sm);
      }
    }

    @media print {
      .site-header,
      .site-footer,
      body::before {
        display: none;
      }

      .content-wrapper {
        max-width: 100%;
      }

      body {
        background: white;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        선<span>(한)</span> 결제
      </a>
      <nav class="site-nav">
        <a href="#background">배경</a>
        <a href="#problem">문제</a>
        <a href="#solution">해결</a>
        <a href="#usage">사용방법</a>
        <a href="#hero" class="nav-cta">다운로드</a>
      </nav>
    </div>
  </header>

  <main class="content-wrapper">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="footer-logo">
        선<span>(한)</span> 결제
      </div>
      <p class="footer-tagline">투명하고 따뜻한 선결제 기부 문화를 만들어갑니다</p>
      <div class="footer-links">
        <a href="{{ '/support' | relative_url }}">고객지원</a>
        <a href="{{ '/privacy-policy' | relative_url }}">개인정보처리방침</a>
        <a href="{{ '/terms-of-service' | relative_url }}">이용약관</a>
      </div>
      <p class="copyright">
        © {{ site.time | date: "%Y" }} 공명 | 사업자등록번호: 520-22-02348
      </p>
    </div>
  </footer>
</body>
</html>
